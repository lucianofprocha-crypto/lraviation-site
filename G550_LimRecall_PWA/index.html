<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="G550 Limits">
<meta name="theme-color" content="#1B2A4A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>G550 Limitations &amp; Recall</title>
<style>
:root{
  --navy:#1B2A4A; --accent:#0B5A8A; --gray:#5b5f66; --line:#e2e5ea;
  --bg:#f5f7fa; --card:#ffffff; --amber:#E8A33D; --amber-dk:#8a4f00; --amber-bg:#fdf3e3;
  --green:#1b7a3d; --green-bg:#e7f5ec; --green-line:#bfe3cc;
  --red:#b71c1c; --red-bg:#fdeceb; --red-line:#f3c4c0; --soft:#f7f9fb; --ink:#1c1f24;
  --blue-bg:#eef5fa; --blue-line:#cfe0ec; --mark:#fff0a8;
}
@media (prefers-color-scheme: dark){
  :root{
    --navy:#cfe0f5; --accent:#5fb0e8; --gray:#9aa3ad; --line:#2c333d;
    --bg:#12161c; --card:#1a2029; --amber:#E8A33D; --amber-dk:#f0b860; --amber-bg:#2e2515;
    --green:#5fcf8a; --green-bg:#15291d; --green-line:#24503a;
    --red:#ff8a80; --red-bg:#2e1716; --red-line:#5a2a27; --soft:#20262f; --ink:#e6e9ee;
    --blue-bg:#16232f; --blue-line:#264158; --mark:#5a4a00;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{overscroll-behavior-y:none;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink);
  padding:calc(18px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom));}
.wrap{max-width:1200px; margin:0 auto;}
.header{text-align:center; margin-bottom:12px;}
.header h1{font-size:22px; margin:0 0 4px; color:var(--navy);}
.header p{font-size:13px; color:var(--gray); margin:0;}
.tabs{display:flex; gap:6px; background:var(--soft); border:1px solid var(--line); padding:4px; border-radius:10px; margin:0 auto 16px; max-width:620px; position:sticky; top:calc(6px + env(safe-area-inset-top)); z-index:5;}
.tabs button{flex:1; border:none; background:none; padding:10px 6px; border-radius:7px; font:600 14px -apple-system,sans-serif; color:var(--gray); cursor:pointer;}
.tabs button.on{background:var(--card); color:var(--navy); box-shadow:0 1px 3px rgba(0,0,0,.12);}
.view{display:none;} .view.on{display:block;}
.card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:14px;}
.card h2{font-size:13.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); margin:0 0 10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
.card h2 .r{margin-left:auto; text-transform:none; letter-spacing:0; font-weight:600; color:var(--gray); font-size:12px;}
.card h3{font-size:14px; margin:14px 0 6px; color:var(--navy); text-transform:uppercase; letter-spacing:.03em;}
.card p{font-size:14.5px; line-height:1.5; margin:6px 0;}
.muted{color:var(--gray); font-size:12.5px;}
.btn{border:none; background:var(--accent); color:#fff; font:700 14px -apple-system,sans-serif; padding:11px 16px; border-radius:8px; cursor:pointer;}
.btn.sec{background:var(--soft); color:var(--accent); border:1px solid var(--line);}
.btn.ok{background:var(--green);} .btn.bad{background:var(--red);}
.btn:disabled{opacity:.45;}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.chip{border:1px solid var(--line); background:var(--card); color:var(--gray); border-radius:999px; padding:7px 13px; font:600 13px -apple-system,sans-serif; cursor:pointer;}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff;}
.seg{display:inline-flex; background:var(--soft); border:1px solid var(--line); border-radius:9px; padding:3px; gap:3px;}
.seg button{border:none; background:none; padding:8px 14px; border-radius:7px; font:700 13.5px -apple-system,sans-serif; color:var(--gray); cursor:pointer;}
.seg button.on{background:var(--card); color:var(--navy); box-shadow:0 1px 3px rgba(0,0,0,.12);}
label.tg{display:flex; align-items:center; gap:8px; font-size:14px; cursor:pointer;}
label.tg input{width:20px; height:20px; accent-color:var(--accent);}
input.search, select.sel{width:100%; font:500 16px -apple-system,sans-serif; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--ink);}
mark{background:var(--mark); color:inherit; border-radius:3px; padding:0 1px;}

/* recall layout */
.rgrid{display:grid; grid-template-columns:290px minmax(0,1fr); gap:14px; align-items:start;}
@media (max-width:760px){ .rgrid{grid-template-columns:1fr;} .plist{max-height:260px !important;} }
.plist{list-style:none; margin:8px 0 0; padding:0; max-height:calc(100vh - 230px); overflow:auto; -webkit-overflow-scrolling:touch;}
.plist li{display:flex; align-items:center; gap:8px; padding:9px 8px; border-radius:8px; cursor:pointer; font-size:14px; line-height:1.3;}
.plist li.on{background:var(--blue-bg); color:var(--navy); font-weight:700;}
.plist li .sc{margin-left:auto; flex:none;}
.badge{display:inline-block; min-width:40px; text-align:center; border-radius:6px; padding:2px 6px; font-size:12px; font-weight:800;}
.b-none{background:var(--soft); color:var(--gray); border:1px solid var(--line);}
.b-ok{background:var(--green-bg); color:var(--green);} .b-mid{background:var(--amber-bg); color:var(--amber-dk);} .b-bad{background:var(--red-bg); color:var(--red);}

/* QRH card */
.qrh-title{font-size:19px; font-weight:800; color:var(--navy); margin:0;}
.ref{font-size:12.5px; color:var(--gray); font-weight:600; margin:2px 0 12px;}
.blk{border-radius:8px; padding:9px 12px; margin:8px 0; font-size:14px; line-height:1.45; white-space:pre-line;}
.b-info{background:var(--blue-bg); border:1px solid var(--blue-line);}
.b-cond{background:var(--amber-bg); border-left:4px solid var(--amber); font-weight:800; font-size:13.5px; letter-spacing:.02em;}
.b-warn{background:var(--red-bg); border:1px solid var(--red-line); color:var(--red); font-weight:800;}
.b-caut{background:var(--amber-bg); border:1px solid var(--amber); color:var(--amber-dk); font-weight:700;}
.b-note{color:var(--gray); font-size:13.5px; border-left:3px solid var(--line); border-radius:0; padding:4px 10px;}
.b-afm{display:inline-block; background:var(--soft); border:1px dashed var(--gray); color:var(--gray); font-weight:700; font-size:12.5px; padding:5px 10px;}
.step{display:grid; grid-template-columns:34px minmax(0,1.15fr) minmax(0,1fr); gap:8px; align-items:baseline; padding:9px 4px; border-bottom:1px solid var(--line); font-size:15.5px;}
.step .n{font-weight:800; color:var(--accent); text-align:right;}
.step .i{position:relative; overflow:hidden; white-space:normal;}
.step .a{font-weight:800; text-align:right;}
.step.hide .a,.step.hide .i.h{filter:blur(7px); user-select:none;}
.step.cur{background:var(--blue-bg); border-radius:8px;}
.step.good .a{color:var(--green);} .step.miss .a{color:var(--red);}
.step .mk{font-size:14px; margin-left:6px;}
.drillbar{position:sticky; bottom:calc(8px + env(safe-area-inset-bottom)); display:flex; gap:8px; margin-top:14px; background:var(--card); padding:8px; border:1px solid var(--line); border-radius:12px; box-shadow:0 4px 14px rgba(0,0,0,.12);}
.drillbar .btn{flex:1; padding:15px 10px; font-size:16px;}
.result{font-size:26px; font-weight:800; color:var(--navy);}
.seqopts{display:grid; gap:8px; margin-top:10px;}
.seqopt{text-align:left; border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:12px 14px; font:600 15px -apple-system,sans-serif; cursor:pointer;}
.seqopt.bad{border-color:var(--red); background:var(--red-bg); animation:shake .3s;}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* limitations */
.lgrid{display:grid; grid-template-columns:minmax(0,1fr); gap:0;}
.sec h2 .g{font-size:11px; background:var(--soft); border:1px solid var(--line); color:var(--gray); padding:2px 8px; border-radius:99px; letter-spacing:.03em;}
table.kv{width:100%; border-collapse:collapse; font-size:14.5px;}
table.kv td{padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.4;}
table.kv td.k{color:var(--ink); width:55%;}
table.kv td.k small{color:var(--gray);}
table.kv td.v{font-weight:800; text-align:right; white-space:pre-line; color:var(--navy);}
table.kv tr:last-child td{border-bottom:none;}
.flash td.v{cursor:pointer;}
.flash td.v:not(.rev){filter:blur(7px); user-select:none;}
.lp{white-space:pre-line;}
.fig{margin:10px 0 4px; text-align:center;}
.fig img{max-width:100%; max-height:560px; background:#fff; border-radius:8px; border:1px solid var(--line); padding:6px; cursor:zoom-in;}
.fig .muted{display:block; margin-top:4px;}
.toolbar{position:sticky; top:calc(62px + env(safe-area-inset-top)); z-index:4; background:var(--bg); padding:6px 0 4px;}
.viewer{position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:50; display:none; overflow:auto; -webkit-overflow-scrolling:touch;}
.viewer.on{display:block;}
.viewer img{display:block; background:#fff; margin:calc(54px + env(safe-area-inset-top)) auto 30px; width:96%; max-width:none;}
.viewer.z2 img{width:190%;}
.viewer .vbar{position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; display:flex; gap:8px; z-index:51;}

/* quiz */
.q{font-size:17px; font-weight:600; line-height:1.45; margin:4px 0 14px; color:var(--navy); white-space:pre-line;}
.qctx{font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); font-weight:800;}
.opts{display:grid; gap:8px;}
.opt{text-align:left; border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:13px 14px; font:600 15px -apple-system,sans-serif; cursor:pointer; white-space:pre-line;}
.opt.ok{border-color:var(--green); background:var(--green-bg);}
.opt.bad{border-color:var(--red); background:var(--red-bg);}
.pbar{height:6px; background:var(--soft); border-radius:9px; overflow:hidden; margin:8px 0 14px;}
.pbar div{height:100%; background:var(--accent); width:0;}
ul.miss{padding-left:18px;} ul.miss li{font-size:14px; margin:6px 0; line-height:1.4;}
table.prog{width:100%; border-collapse:collapse; font-size:14px;}
table.prog th{text-align:left; font-size:12px; color:var(--gray); text-transform:uppercase; padding:6px; border-bottom:1px solid var(--line);}
table.prog td{padding:7px 6px; border-bottom:1px solid var(--line);}
.stat{display:inline-block; margin-right:22px;} .stat b{display:block; font-size:24px; color:var(--navy);} .stat span{font-size:12px; color:var(--gray);}
details summary{cursor:pointer; font-weight:700; color:var(--accent); font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>G550 Limitations &amp; Recall</h1>
    <p>Offline study aid · Recall items &amp; limitations summary (AFM Rev 44 based) · Not for operational use</p>
  </div>
  <div class="tabs" id="tabs">
    <button data-v="recall" class="on">Recall</button>
    <button data-v="lims">Limitations</button>
    <button data-v="quiz">Quiz</button>
    <button data-v="prog">Progress</button>
  </div>

  <!-- RECALL -->
  <section class="view on" id="v-recall">
    <div class="rgrid">
      <div class="card" style="padding:12px">
        <input class="search" id="pSearch" placeholder="Search procedures…" autocomplete="off">
        <div class="row" style="margin-top:8px">
          <button class="btn sec" id="pRandom" style="flex:1">Random</button>
          <button class="btn sec" id="pWeak" style="flex:1">Weakest</button>
        </div>
        <ul class="plist" id="plist"></ul>
      </div>
      <div>
        <div class="row" style="margin-bottom:10px">
          <div class="seg" id="rMode">
            <button data-m="study" class="on">Study</button>
            <button data-m="drill">Drill</button>
            <button data-m="seq">Sequence</button>
          </div>
          <label class="tg" id="hideItemWrap"><input type="checkbox" id="hideItem"> Hide items too</label>
          <label class="tg" id="notesWrap"><input type="checkbox" id="showNotes" checked> Notes</label>
        </div>
        <div class="card" id="rPane"></div>
        <details class="card" id="defs"><summary>Landing definitions</summary><div id="defsBody"></div></details>
      </div>
    </div>
  </section>

  <!-- LIMITATIONS -->
  <section class="view" id="v-lims">
    <div class="toolbar">
      <div class="row">
        <input class="search" id="lSearch" placeholder="Search limitations (e.g. Vmo, TGT, -40, oxygen)…" autocomplete="off" style="flex:2; min-width:220px">
        <select class="sel" id="lJump" style="flex:1; min-width:180px"></select>
      </div>
      <div class="row" style="margin-top:8px">
        <div class="chips" id="lGroups" style="margin:0"></div>
        <label class="tg" style="margin-left:auto"><input type="checkbox" id="flash"> Hide values (tap to reveal)</label>
      </div>
    </div>
    <div id="lBody" style="margin-top:10px"></div>
  </section>

  <!-- QUIZ -->
  <section class="view" id="v-quiz">
    <div class="card" id="qSetup">
      <h2>Quiz setup</h2>
      <div class="muted" style="margin-bottom:6px">Source</div>
      <div class="chips" id="qSrc"></div>
      <div id="qGroupWrap">
        <div class="muted" style="margin-bottom:6px">Limitations area</div>
        <div class="chips" id="qGroup"></div>
      </div>
      <div class="muted" style="margin-bottom:6px">Questions</div>
      <div class="chips" id="qN"></div>
      <div class="row"><button class="btn" id="qStart">Start</button><span class="muted" id="qAvail"></span></div>
    </div>
    <div class="card" id="qRun" style="display:none"></div>
  </section>

  <!-- PROGRESS -->
  <section class="view" id="v-prog"><div id="progBody"></div></section>
</div>

<div class="viewer" id="viewer">
  <div class="vbar"><button class="btn sec" id="vZoom">Zoom</button><button class="btn" id="vClose">Close</button></div>
  <img id="vImg" alt="">
</div>

<script>
const DATA={"recall": [{"id": "engine-failure-considerations", "name": "Engine Failure Considerations", "ref": "AFM 04-06-10 REV44", "body": [{"k": "cond", "t": "SHUT DOWN ENGINE WHEN THE FOLLOWING OCCURS"}, {"k": "note", "t": "• Engine fire.\n• Extreme engine vibration.\n• Excessive or uncontrollable power loss.\n• Sudden increase or decrease in oil pressure beyond limits.\n• Sustained high oil temperature above limits.\n• Sudden uncontrollable increase in TGT beyond limits.\n• Any other condition that indicates the advisability of engine shut down.\n• If hydraulic fluid temperature reaches 150°C and hydraulic pressure exceeds 3600 PSI"}]}, {"id": "apu-fire", "name": "APU Fire", "ref": "AFM 04-10-40 REV44", "body": [{"k": "info", "t": "EICAS Warning: APU FIRE\nAural Warning: BELL"}, {"k": "step", "n": "1", "i": "APU MASTER", "a": "OFF"}, {"k": "step", "n": "2", "i": "APU FIRE EXT", "a": "DEPRESS"}, {"k": "step", "n": "3", "i": "APU FIRE indicator", "a": "MONITOR"}, {"k": "afm"}, {"k": "note", "t": "In flight consider diversion to the nearest suitable airport"}, {"k": "note", "t": "On ground APU FIRE may lead to an Emergency Evacuation"}]}, {"id": "start-valve-failure-to-close-after-engine-start", "name": "Start Valve Failure to Close After Engine Start", "ref": "AFM 03-09-30 REV44", "body": [{"k": "cond", "t": "FLASHING AMBER SVO ICON DISPLAYED"}, {"k": "step", "n": "1", "i": "START MASTER", "a": "PRESS / LIGHT OUT"}, {"k": "step", "n": "2", "i": "L / R ENG BLEED AIR", "a": "OFF"}, {"k": "step", "n": "3", "i": "APU (or External) BLEED AIR", "a": "OFF"}, {"k": "cond", "t": "WHEN BLEED AIR PRESSURE STABILIZES AT MINIMUM VALUE (AFTER 30 SECONDS)"}, {"k": "step", "n": "4", "i": "Affected FUEL CONTROL", "a": "OFF"}]}, {"id": "engine-failure-to-start", "name": "Engine Failure to Start", "ref": "AFM 03-09-10 REV44", "body": [{"k": "step", "n": "1", "i": "Affected Engine FUEL CONTROL", "a": "OFF"}, {"k": "step", "n": "2", "i": "START MASTER", "a": "OFF"}, {"k": "step", "n": "3", "i": "Cause of Engine Failure to Start", "a": "INVESTIGATE AND CORRECT"}, {"k": "afm"}]}, {"id": "engine-exceedance", "name": "Engine Exceedance", "ref": "AFM 04-07-50 REV44", "body": [{"k": "step", "n": "1", "i": "Power Lever (s)", "a": "RETARD"}, {"k": "step", "n": "2", "i": "TGT / LP / HP Indications", "a": "CHECK"}, {"k": "cond", "t": "IF EXCEEDANCE CANNOT BE RECOVERED, OR IF OTHER AFFECTED ENGINE PARAMETERS ARE NOT NORMAL"}, {"k": "step", "n": "3", "i": "Affected Engine", "a": "SHUT DOWN"}, {"k": "afm"}]}, {"id": "hot-start", "name": "Hot Start", "ref": "AFM 03-09-50 REV44", "body": [{"k": "step", "n": "1", "i": "Affected Engine FUEL CONTROL", "a": "OFF"}, {"k": "step", "n": "2", "i": "START MASTER", "a": "OFF"}, {"k": "step", "n": "3", "i": "30 second Engine Cranking Cycle", "a": "PERFORM BEFORE ATTEMPTING ANOTHER START"}, {"k": "afm"}]}, {"id": "tailpipe-fire", "name": "Tailpipe Fire", "ref": "AFM 04-10-30 REV44", "body": [{"k": "step", "n": "1", "i": "Affected Engine", "a": "IDENTIFIED"}, {"k": "step", "n": "2", "i": "Both Power Levers", "a": "IDLE"}, {"k": "step", "n": "3", "i": "Affected Engine FUEL CONTROL", "a": "OFF"}, {"k": "step", "n": "4", "i": "APU AIR", "a": "OFF"}, {"k": "step", "n": "5", "i": "ISOLATION Valve", "a": "OPEN"}, {"k": "step", "n": "6", "i": "CRANK MASTER", "a": "ON"}, {"k": "step", "n": "7", "i": "Affected Engine ENG START", "a": "ON"}, {"k": "step", "n": "8", "i": "SVO", "a": "VERIFY"}, {"k": "step", "n": "9", "i": "Crank Cycle", "a": "CONTINUE UNTIL FIRE IS OUT"}, {"k": "step", "n": "10", "i": "Emergency Crew", "a": "NOTIFIED"}, {"k": "step", "n": "11", "i": "Remaining Engine", "a": "SHUT DOWN"}]}, {"id": "uncommanded-nosewheel-steering", "name": "Uncommanded Nosewheel Steering", "ref": "AFM 03-18-60 REV44", "body": [{"k": "step", "n": "1", "i": "Directional Control", "a": "USE DIFFERENTIAL BRAKES AND RUDDER"}, {"k": "step", "n": "2", "i": "NOSEWHEEL STEERING POWER", "a": "OFF"}, {"k": "note", "t": "There are several factors that can make nosewheel steering very challenging during landing – from environmental factors, such as runway conditions and the presence of crosswinds, to uncommanded nosewheel steering. Uncommanded nosewheel steering can go undetected, with no indication in the cockpit until the event has occurred. Vigilance is required on the part of the flight crew to prepare for an unlikely event of this nature.\nNormal preparation for countermanding the potential of a nosewheel steering problem during landing requires the pilot to have the capability to apply both full rudder deflection and full brake pedal actuation. Typically, flight crews land with their heels on the floor, actuating the rudder pedals for directional control and then slide their feet up the pedals to actuate the brake pedals. For crosswind landings, or potential steering failures, the habit of having your heels on the floor requires that crews assure that brake application is possible with simultaneous full rudder pedal deflection. Proper seat adjustment requires a position that allows for full rudder deflection with the feet located on the brake pedals, and free angular rotation of the ankle is available to command full braking. This usually requires there be a slight bend in the knee with full rudder pedal deflection."}]}, {"id": "engine-fire-on-ground", "name": "ENGINE Fire (ON GROUND)", "ref": "AFM 04-10-20 REV44", "body": [{"k": "info", "t": "EICAS Warning: L-R Engine Fire\nLight: Engine Fire Handle and Fuel Control switch\nAural Warning: BELL."}, {"k": "info", "t": "Possible Cause (s): Both fire loops sense an engine fire"}, {"k": "step", "n": "1", "i": "Both Power levers", "a": "IDLE"}, {"k": "step", "n": "2", "i": "Airplane", "a": "STOP"}, {"k": "step", "n": "3", "i": "PARK/EMERG BRAKE", "a": "SET"}, {"k": "step", "n": "4", "i": "Both FUEL CONTROL switches", "a": "OFF"}, {"k": "step", "n": "5", "i": "Affected Engine", "a": "IDENTIFY"}, {"k": "step", "n": "6", "i": "Affected Engine FIRE Handle", "a": "PULL"}, {"k": "step", "n": "7", "i": "Are fire warning indications still present?", "a": "(Assuming the fire persists) YES"}, {"k": "cond", "t": "IF NO FIRE INDICATIONS → AFM"}, {"k": "step", "n": "11", "i": "Affected Engine FIRE Handle", "a": "ROTATE DO DISCH 1, turn to extreme OUTBOARD position"}, {"k": "cond", "t": "START TIME"}, {"k": "step", "n": "", "i": "Are fire warning indications still present after 30 seconds?", "a": "(Assuming the fire persists) YES"}, {"k": "step", "n": "16", "i": "Affected Engine FIRE Handle", "a": "ROTATE DO DISCH 2, turn to extreme INBOARD position"}, {"k": "afm"}]}, {"id": "engine-failure-below-v1-rejected-takeoff", "name": "Engine Failure Below V1 (Rejected Takeoff)", "ref": "AFM 04-06-20 REV44", "body": [{"k": "step", "n": "1", "i": "Power Lever (s)", "a": "IDLE"}, {"k": "step", "n": "2", "i": "Maximum Anti-Skid Braking", "a": "APPLY"}, {"k": "step", "n": "3", "i": "SPEED BRAKE", "a": "EXTEND"}, {"k": "note", "t": "Ground spoilers should extend automatically when the power levers are retarded to idle during an aborted takeoff. Extending the speed brakes is required to ensure all spoilers are extended."}, {"k": "note", "t": "Any takeoff abort should be a maximum stop effort, regardless of the speed at which it is initiated."}, {"k": "step", "n": "4", "i": "Thrust Reversers", "a": "AS REQUIRED"}, {"k": "note", "t": "During a rejected takeoff (RTO), reverse thrust may be used to bring the airplane to a stop (zero ground speed). If reverse thrust is used below 60 KCAS, record the event and report the occurrence for maintenance action."}, {"k": "cond", "t": "WHEN CLEAR OF RUNWAY"}, {"k": "step", "n": "5", "i": "Appropriate Abnormal / Emerg Check", "a": "COMPLETE"}, {"k": "step", "n": "6", "i": "Brake Temperature", "a": "MONITOR"}, {"k": "step", "n": "7", "i": "After Landing Checklist", "a": "COMPLETE"}]}, {"id": "engine-failure-above-v1", "name": "Engine Failure Above V1", "ref": "AFM 04-06-30 REV44", "body": [{"k": "step", "n": "1", "i": "Directional Control", "a": "MAINTAIN"}, {"k": "step", "n": "2", "i": "Vr Speed", "a": "ROTATE"}, {"k": "step", "n": "3", "i": "Airspeed", "a": "MAINTAIN V2 to V2 + 10 KCAS"}, {"k": "step", "n": "4", "i": "Landing Gear", "a": "UP"}, {"k": "note", "t": "If engine failure should occur after passing V2 on takeoff, it is recommended that the speed at the time of engine failure (up to V2 +10 knots) be maintained. A speed of V2 +10 knots in single-engine takeoff configuration will produce the maximum climb gradient available."}, {"k": "step", "n": "5", "i": "Climb", "a": "ATTAIN 1,500 FEET AAL or CLEAR OF OBSTACLES"}, {"k": "note", "t": "For an obstacle above 1500 ft AAL or a SID that requires a climb to more than 1500 ft AAL, continue climbing at V2 speed with flaps in the takeoff position until the obstacle is cleared or the SID requirement has been satisfied."}, {"k": "step", "n": "6", "i": "FLAP handle", "a": "UP, WHEN GREATER THAN V2+20 KCAS"}, {"k": "step", "n": "7", "i": "Did flaps retract normally?", "a": "YES"}, {"k": "step", "n": "8", "i": "PWR XFR UNIT", "a": "ON"}, {"k": "step", "n": "9", "i": "AUX PUMP", "a": "ON"}, {"k": "step", "n": "10", "i": "Airspeed", "a": "ACCELERATE TO Vse OR GREATER"}, {"k": "step", "n": "11", "i": "Operating ENGINE Power Lever", "a": "MCT OR AS REQUIRED"}, {"k": "note", "t": "Takeoff power may be maintained for ten minutes during single-engine operations as needed. Power should then be reduced to Maximum Continuous Thrust (MCT)."}, {"k": "afm"}]}, {"id": "thrust-reverser-unlock-or-deploy-during-takeoff", "name": "Thrust Reverser Unlock or Deploy During Takeoff", "ref": "AFM 04-23-10 REV44", "body": [{"k": "cond", "t": "IF BELOW V1"}, {"k": "step", "n": "1", "i": "Takeoff", "a": "ABORT"}, {"k": "step", "n": "2", "i": "Engine Failure Below V1 Checklist", "a": "PERFORM"}, {"k": "cond", "t": "IF ABOVE V1"}, {"k": "step", "n": "3", "i": "Affected Engine Power Lever", "a": "IDLE"}, {"k": "note", "t": "FADEC will command the associated engine to idle. The power lever will remain at its last position."}, {"k": "step", "n": "4", "i": "Takeoff", "a": "CONTINUE AS SINGLE ENGINE INOPERATIVE"}, {"k": "step", "n": "5", "i": "Airspeed", "a": "DO NOT EXCEED 200 KCAS"}, {"k": "step", "n": "6", "i": "Affected T/REV MAN STOW", "a": "ON (WHEN SITUATION PERMITS)"}, {"k": "afm"}]}, {"id": "low-fuel-pressure", "name": "Low Fuel Pressure", "ref": "AFM 04-07-30 REV44", "body": [{"k": "step", "n": "1", "i": "L / R MAIN and ALT Boost Pumps", "a": "ON"}, {"k": "afm"}]}, {"id": "engine-fire-in-flight", "name": "ENGINE Fire (IN FLIGHT)", "ref": "AFM 04-10-10 REV44", "body": [{"k": "info", "t": "EICAS Warning: L-R Engine Fire\nLight: Engine Fire Handle and Fuel Control switch\nAural Warning: BELL."}, {"k": "note", "t": "A L-R Engine Fire (warning) CAS accompanied by red lights illuminated in the associated FIRE HANDLE and FUEL CONTROL switch is a valid indication of an engine fire."}, {"k": "info", "t": "Possible Cause (s): Both fire loops sense an engine fire"}, {"k": "step", "n": "1", "i": "Affected engine", "a": "CONFIRM"}, {"k": "step", "n": "2", "i": "Power lever (Affected engine)", "a": "IDLE"}, {"k": "warn", "t": "CREW SHALL AGREE ON THE CORRECT (AFFECTED ENGINE) PRIOR TO ANY FURTHER ACTION"}, {"k": "step", "n": "3", "i": "FUEL CONTROL (Affected engine)", "a": "OFF"}, {"k": "step", "n": "4", "i": "FIRE Handle (Affected engine)", "a": "PULL"}, {"k": "step", "n": "5", "i": "FIRE Handle (Affected engine)", "a": "ROTATE DO DISCH 1, turn to extreme OUTBOARD position"}, {"k": "cond", "t": "START TIME"}, {"k": "step", "n": "6", "i": "Are fire warning indications still present after 30 seconds?", "a": "(Assuming the fire persists) YES"}, {"k": "step", "n": "7", "i": "FIRE Handle (Affected engine)", "a": "ROTATE DO DISCH 2, turn to extreme INBOARD position"}, {"k": "afm"}]}, {"id": "dual-engine-failure-mid-altitude", "name": "Dual Engine Failure – Mid Altitude", "ref": "AFM 04-06-60 REV44", "body": [{"k": "cond", "t": "IF BOTH ENGINES FLAME OUT AT MID-ALTITUDE (APPROXIMATELY 20,000 FT)"}, {"k": "step", "n": "1", "i": "Aircraft Pitch", "a": "ESTABLISH 10° NOSE DOWN ATTITUDE"}, {"k": "step", "n": "2", "i": "Airspeed", "a": "ACCELERATE TO 250 KCAS (200 KCAS MIN)"}, {"k": "cond", "t": "AT 200 KCAS"}, {"k": "step", "n": "3", "i": "L / R CONT IGN", "a": "ON"}, {"k": "step", "n": "4", "i": "L /R FUEL CONTROL", "a": "RUN"}, {"k": "step", "n": "5", "i": "Engine Start", "a": "MONITOR ON DU 1 AND 4 ENG DISPLAY OR ON MCDU #1 BACKUP ENGINE DATA"}, {"k": "afm"}]}, {"id": "dual-generator-failure", "name": "Dual Generator Failure", "ref": "AFM 04-04-10 REV45", "body": [{"k": "cond", "t": "REMOVE ALL NON-ESSENTIAL LOADS"}, {"k": "step", "n": "1", "i": "X FLOW", "a": "OPEN"}, {"k": "step", "n": "2", "i": "L / R MAIN Boost Pumps", "a": "VERIFY BOTH ON"}, {"k": "step", "n": "3", "i": "L / R ALT Boost Pumps", "a": "VERIFY BOTH OFF"}, {"k": "step", "n": "4", "i": "L /R GEN Switches", "a": "OFF THEN ON"}, {"k": "step", "n": "5", "i": "Is power restored?", "a": "NO (IF YES END)"}, {"k": "afm"}]}, {"id": "dual-engine-flameout", "name": "Dual Engine Flameout", "ref": "AFM 04-06-40 REV45", "body": [{"k": "step", "n": "1", "i": "Crew Oxygen Masks (100%)", "a": "DON"}, {"k": "step", "n": "2", "i": "Power Levers", "a": "IDLE"}, {"k": "step", "n": "3", "i": "L / R FUEL CONTROL", "a": "OFF"}, {"k": "step", "n": "4", "i": "Descent to Airstart Envelope*", "a": "PERFORM AT Vmo / Mmo"}, {"k": "note", "t": "With both engines out, there is diminished hydraulic power to the flight controls. Use pitch trim as necessary to maintain VMO / MMO in the descent."}, {"k": "step", "n": "5", "i": "Passenger Oxygen Masks", "a": "MANUALLY DEPLOY"}, {"k": "cond", "t": "AT 39,000 FT OR BELOW"}, {"k": "step", "n": "6", "i": "APU", "a": "START"}, {"k": "step", "n": "7", "i": "APU GEN", "a": "ON"}, {"k": "step", "n": "8", "i": "Engine Start", "a": "Monitor ENGINE DATA (DU 1 & 4 or MCDU 1)"}, {"k": "cond", "t": "AT 25,000 FT OR BELOW / ABOVE 250 KIAS / PERFORM WINDMILL START"}, {"k": "step", "n": "9", "i": "L / R ENG BLEED AIR", "a": "OFF"}, {"k": "step", "n": "10", "i": "L / R ECS PACK", "a": "OFF"}, {"k": "step", "n": "11", "i": "L / R CONT IGN", "a": "ON"}, {"k": "step", "n": "12", "i": "L / R FUEL CONTROL (One at a time)", "a": "RUN"}, {"k": "step", "n": "13", "i": "FF / TGT Indications", "a": "MONITOR"}, {"k": "step", "n": "14", "i": "Deceleration", "a": "SLOW TO MAX L/D SPEED (Vref Flaps 0 + 10 KCAS)"}, {"k": "note", "t": "After one or both engines relight, allow engines to stabilize for 5 minutes while continuing descent at MAX L/D speed."}, {"k": "step", "n": "15", "i": "L / R ENG BLEED AIR", "a": "ON"}, {"k": "step", "n": "16", "i": "L / R ECS PACK", "a": "ON"}, {"k": "afm"}]}, {"id": "airplane-interior-fire-smoke-fumes", "name": "Airplane Interior Fire / Smoke / Fumes", "ref": "AFM 04-10-50 REV44", "body": [{"k": "warn", "t": "DO NOT DELAY DESCENT OR DIVERSION TO FIND THE SMOKE SOURCE. CONSIDER LANDING THE AIRCRAFT AS SOON AS POSSIBLE EVEN IF FIRE HAS BEEN EXTINGUISHED OR SMOKE HAS CLEARED."}, {"k": "step", "n": "1", "i": "Crew O2 Masks (100%) Smoke Goggles", "a": "DON"}, {"k": "step", "n": "2", "i": "PASSENGER OXYGEN MASKS Knob", "a": "MAN"}, {"k": "step", "n": "3", "i": "PASSENGER OXYGEN MASKS", "a": "VERIFY DEPLOYED"}, {"k": "note", "t": "NOTE: Visually check that an oxygen mask deployed for each passenger."}, {"k": "step", "n": "4", "i": "Crew and Cabin Communication", "a": "ESTABLISH"}, {"k": "step", "n": "5", "i": "NO SMOKE", "a": "ON"}, {"k": "step", "n": "6", "i": "SEAT BELT", "a": "ON"}, {"k": "step", "n": "7", "i": "All overhead and Pedestal Master", "a": "OFF"}, {"k": "step", "n": "8", "i": "EMERGENCY POWER", "a": "ON"}, {"k": "step", "n": "9", "i": "Rapid Descent (if practical)", "a": "BEGIN"}, {"k": "step", "n": "10", "i": "Where is the fire, smoke, and/or fumes?", "a": "AFM"}]}, {"id": "smoke-fumes-evacuation", "name": "Smoke / Fumes Evacuation", "ref": "", "body": [{"k": "step", "n": "1", "i": "CABIN PRESSURE CONTROL", "a": "SEMI"}, {"k": "step", "n": "2", "i": "LANDING ELEV", "a": "7900"}, {"k": "step", "n": "3", "i": "AIRCRAFT / CABIN ALTITUDE", "a": "SET CABIN TO 7900"}]}, {"id": "emergency-descent-procedure", "name": "Emergency Descent Procedure", "ref": "AFM 04-21-30 REV44", "body": [{"k": "note", "t": "The following procedure assumes structural integrity of airplane. If airplane structural integrity is in doubt, limit speed as much as possible and avoid high maneuvering loads."}, {"k": "step", "n": "1", "i": "Power Levers", "a": "IDLE"}, {"k": "step", "n": "2", "i": "Airspeed", "a": "ESTABLISH Mmo/Vmo"}, {"k": "note", "t": "An initial pitch attitude of 8° to 10° nose down is recommended to commence descent. As speed approaches Mmo / Vmo, extend the speed brake to maximize the rate of descent. Adjust pitch attitude as necessary to avoid an overspeed condition."}, {"k": "step", "n": "3", "i": "SPEED BRAKE", "a": "EXTEND"}, {"k": "step", "n": "4", "i": "Airspeed", "a": "MAINTAIN Mmo/Vmo"}, {"k": "note", "t": "It is recommended that the emergency descent be flown manually in order to achieve maximum descent rate."}, {"k": "step", "n": "5", "i": "SEAT BELT / NO SMOKE", "a": "ON"}, {"k": "step", "n": "6", "i": "Transponder Code", "a": "7700"}, {"k": "step", "n": "7", "i": "ATC", "a": "NOTIFY"}, {"k": "step", "n": "8", "i": "Level Off", "a": "15,000 FT OR MEA, IF HIGHER"}]}, {"id": "cabin-pressure-low", "name": "Cabin Pressure Low", "ref": "AFM 3A-03-20 REV44", "body": [{"k": "info", "t": "EICAS Warning: Cabin Pressure Low\nAural Warning: BELL."}, {"k": "info", "t": "Possible Cause (s): Cabin altitude has climbed above predetermined based on [LFE]."}, {"k": "note", "t": "If EDM activates, it is recommended to leave the autopilot engaged during descent."}, {"k": "step", "n": "1", "i": "Crew Oxygen Masks", "a": "DON"}, {"k": "step", "n": "2", "i": "MIC button (ACP)", "a": "EXTEND"}, {"k": "step", "n": "3", "i": "Emergency Descent", "a": "EXECUTE IF REQUIRED"}, {"k": "step", "n": "4", "i": "Passengers Oxygen Masks", "a": "MANUALLY DEPLOY AND VERIFY"}, {"k": "step", "n": "5", "i": "EMERGENCY POWER", "a": "ON"}, {"k": "step", "n": "6", "i": "Cabin altitude", "a": "VERIFY"}, {"k": "afm"}]}, {"id": "aileron-hops-activation", "name": "Aileron HOPS Activation", "ref": "AFM 03-13-30 REV44", "body": [{"k": "note", "t": "In the event either aileron actuator is out of phase with pilot input, both left and right hydraulic system power is removed from both ailerons.\nAileron Hardover Prevention System (HOPS) activation is presented to the flight crew by an\nL-R Aileron Hydraulics Off (caution) message displayed on CAS."}, {"k": "step", "n": "1", "i": "Autopilot", "a": "DISCONNECT"}, {"k": "step", "n": "2", "i": "Speed Brakes", "a": "RETRACT"}, {"k": "afm"}]}, {"id": "jammed-ailerons", "name": "Jammed Ailerons", "ref": "AFM 04-13-20 REV44", "body": [{"k": "step", "n": "1", "i": "Autopilot", "a": "DISCONNECT"}, {"k": "step", "n": "2", "i": "Speed Brakes", "a": "RETRACT"}, {"k": "note", "t": "Counter any rolling moment with opposite rudder. Prior to actuating the aileron disconnect, have both pilots hold their control wheels firmly to counteract any potential rolling moment."}, {"k": "step", "n": "3", "i": "Aileron DISC Handle", "a": "PULL"}, {"k": "step", "n": "4", "i": "Free Aileron", "a": "DETERMINE"}, {"k": "afm"}]}, {"id": "flight-control-runaway-to-hardover-position", "name": "Flight Control Runaway to Hardover Position", "ref": "AFM 03-13-20 REV44", "body": [{"k": "note", "t": "Display of L-R Aileron Hydraulics Off (caution), L-R Elevator Hydraulics Off (caution) or Rudder Hydraulics Off (caution) messages indicates the Hardover Prevention System (HOPS) has attempted to remedy the failure of an actuator to follow pilot commands or a detected hardover condition by shutting off hydraulic power to the affected aileron, elevator or rudder actuator.\nFlight spoiler actuators are not protected by HOPS. A flight spoiler system anomaly or hardover can be manually alleviated by shutting off hydraulic power to the flight spoiler system. This is achieved through the use of the SPOILER CONTROL switch, located on the center pedestal. Selection of this switch to OFF will remove both Left Hydraulic System (L SYS) and Right Hydraulic System (R SYS) hydraulic power to all flight spoilers.\nFor all of the following procedures, it is recommended that the flight crew select the FLIGHT CONTROLS synoptic page to be used as an aid in assessing the situation."}, {"k": "step", "n": "1", "i": "Autopilot", "a": "DISCONNECT"}, {"k": "step", "n": "2", "i": "Speed Brakes", "a": "RETRACT"}, {"k": "afm"}]}, {"id": "elevator-hops-activation", "name": "Elevator HOPS Activation", "ref": "AFM 03-13-40 REV44", "body": [{"k": "note", "t": "In the event an elevator actuator is out of phase with pilot input, the hydraulic system to that actuator will be shut off. In the event of one hydraulic system being shut off to one elevator actuator, no reduction in control effectiveness will be experienced.\nLoss of one or both hydraulic sources to a single elevator actuator would result in one of the following CAS messages, depending on the affected elevator:\nL Elevator Hydraulics Off (caution)\nR Elevator Hydraulics Off (caution)"}, {"k": "step", "n": "1", "i": "Autopilot", "a": "DISCONNECT"}, {"k": "step", "n": "2", "i": "Speed Brakes", "a": "RETRACT"}, {"k": "afm"}]}, {"id": "jammed-elevator-on-takeoff", "name": "Jammed Elevator (on takeoff)", "ref": "AFM 04-13-30 REV44", "body": [{"k": "step", "n": "2", "i": "Airspeed", "a": "DO NOT EXCEED V2 + 10 KTS MAXIMUM"}, {"k": "note", "t": "Prior to actuating the elevator disconnect, have both pilots hold their yoke firmly to counteract any potential pitching moment."}, {"k": "step", "n": "3", "i": "Elevator DISC Handle", "a": "PULL"}, {"k": "afm"}]}, {"id": "jammed-elevator-while-enroute", "name": "Jammed Elevator (while enroute)", "ref": "AFM 04-13-30 REV44", "body": [{"k": "step", "n": "16", "i": "Autopilot", "a": "DISCONNECT"}, {"k": "step", "n": "17", "i": "Configuration / Airspeed", "a": "MAINTAIN CURRENT CONFIG AND SAFE A/S"}, {"k": "note", "t": "Prior to actuating the elevator disconnect, have both pilots hold their yoke firmly to counteract any potential pitching moment."}, {"k": "step", "n": "18", "i": "Elevator DISC Handle", "a": "PULL"}, {"k": "afm"}]}, {"id": "ground-spoiler-failure-inflight", "name": "Ground Spoiler Failure Inflight", "ref": "AFM 04-13-80 REV44", "body": [{"k": "step", "n": "1", "i": "GND SPLR", "a": "OFF"}, {"k": "step", "n": "2", "i": "GND SPOILERS CB: CPOP, E2", "a": "PULL"}]}, {"id": "mach-trim-failure", "name": "Mach Trim Failure", "ref": "AFM 03-02-40 REV44", "body": [{"k": "cond", "t": "IF MACH TRIM FAILURE RESULTS IN UNDESIRED PITCH TRIM"}, {"k": "step", "n": "1", "i": "A/P DISC", "a": "PUSH AND HOLD"}, {"k": "step", "n": "2", "i": "Electric Pitch Trim", "a": "DISENG"}, {"k": "note", "t": "Since electric pitch trim is no longer available, the manual trim wheel must be used"}, {"k": "step", "n": "3", "i": "A/P DISC", "a": "RELEASE"}, {"k": "step", "n": "4", "i": "Airspeed", "a": "MAINTAIN AT OR BELOW 0.80 MT"}]}, {"id": "pitch-trim-runaway", "name": "Pitch Trim Runaway", "ref": "AFM 03-13-60 REV44", "body": [{"k": "cond", "t": "IF MACH TRIM FAILURE RESULTS IN UNDESIRED PITCH TRIM"}, {"k": "step", "n": "1", "i": "A/P DISC", "a": "PUSH AND HOLD"}, {"k": "step", "n": "2", "i": "PITCH TRIM ENG / DISENG", "a": "DISENG"}, {"k": "step", "n": "3", "i": "A/P DISC", "a": "RELEASE"}, {"k": "caut", "t": "CAUTION: SUBSEQUENT ATTEMPTS TO ENGAGE THE AUTOPILOT WILL RESULT IN AUTOMATIC RE-ENGAGEMENT OF ELECTRIC PITCH TRIM."}, {"k": "cond", "t": "ALTERNATE PROCEDURE"}, {"k": "step", "n": "4", "i": "Manual Pitch Trim Wheel", "a": "GRASP AND HOLD"}, {"k": "step", "n": "5", "i": "PITCH TRIM ENG / DISENG", "a": "DISENG"}]}, {"id": "stall-barrier-malfunction", "name": "Stall Barrier Malfunction", "ref": "AFM 04-13-70 REV44", "body": [{"k": "cond", "t": "IF UNWANTED STALL BARRIER ACTUATION WHILE HAND-FLYING AIRPLANE"}, {"k": "step", "n": "1", "i": "A/P DISC", "a": "PUSH AND HOLD"}, {"k": "step", "n": "2", "i": "STALL BARR", "a": "OFF"}, {"k": "step", "n": "3", "i": "A/P DISC", "a": "RELEASE"}, {"k": "step", "n": "4", "i": "Airspeed", "a": "MAINTAIN MINIMUM Vref"}, {"k": "afm"}, {"k": "cond", "t": "IF UNWANTED STALL BARRIER ACTUATION WITH AUTOPILOT ENGAGED"}, {"k": "step", "n": "8", "i": "STALL BARR", "a": "OFF"}, {"k": "afm"}]}, {"id": "yaw-damper-failure", "name": "Yaw Damper Failure", "ref": "AFM 03-02-50 REV44", "body": [{"k": "cond", "t": "IF YAW DAMPER FAILURE IS ASSOCIATED WITH LOSS OF EITHER LEFT OR RIGHT HYDRAULIC SYSTEM"}, {"k": "step", "n": "1", "i": "Operating Hydraulic System", "a": "VERIFY"}, {"k": "step", "n": "2", "i": "Flight Guidance Computer (FGC) Sel.", "a": "MATCH TO OPERATING HYDRAULIC SYSTEM"}, {"k": "note", "t": "a. Left Hydraulic System Operating = FGC 1\nb. Right Hydraulic System Operating = FGC 2\nc. Standby Rudder (STBY RUD) System Operating = FGC 1"}, {"k": "cond", "t": "IF YAW DAMPER FAILURE IS NOT ASSOCIATED WITH A HYDRAULIC SYSTEM"}, {"k": "step", "n": "1", "i": "A/P DISC", "a": "DISCONNECT"}, {"k": "step", "n": "2", "i": "Opposite FGC", "a": "SELECT"}, {"k": "step", "n": "3", "i": "Yaw Damper", "a": "ENGAGE"}, {"k": "cond", "t": "IF YAW DAMPER OFF (CAUTION) CAS MESSAGE REMAINS DISPLAYED"}, {"k": "step", "n": "4", "i": "Altitude", "a": "45,000 FT MAXIMUM"}, {"k": "step", "n": "5", "i": "Airspeed", "a": "IN ACCORDANCE WITH ALTITUDE"}, {"k": "note", "t": "a. Above 10,000 Feet — MAXIMUM SPEED IS 260 KCAS / 0.80 MT\nb. Below 10,000 Feet — MAXIMUM SPEED IS 250 KCAS\nc. Above 20,000 Feet — MINIMUM SPEED IS 210 KCAS\nd. Below 20,000 Feet — REFER TO FOLLOWING SPEED SCHEDULE\nBelow 20,000 feet, the minimum speed is in accordance with the following schedule until ready to configure for approach and landing.\nVREF as presented on the airspeed tape is the approach speed for landing in the current flap setting.\nRefer to the airspeed limitations given in Table 1. G550 Minimum Airspeeds: Yaw Damper Inoperative Schedule."}]}, {"id": "rudder-hops-activation", "name": "Rudder HOPS Activation", "ref": "AFM 03-13-50 REV44", "body": [{"k": "note", "t": "In the event a rudder actuator is out of phase with pilot input, the hydraulic system pressure to that actuator will be shutoff. Loss of a single hydraulic source to the rudder actuator results in no reduction in control effectiveness, and the following CAS messages:\nRudder Hydraulics Off (caution)\nSingle Rudder (advisory)"}, {"k": "step", "n": "1", "i": "Autopilot", "a": "DISCONNECT"}, {"k": "step", "n": "2", "i": "Speed Brakes", "a": "RETRACT"}, {"k": "afm"}]}, {"id": "hud-malfunction-between-300-ft-and-da", "name": "HUD Malfunction Between 300 FT AND DA", "ref": "AFM 03-16-140 REV44", "body": [{"k": "step", "n": "5", "i": "Go-Around", "a": "EXECUTE"}, {"k": "note", "t": "Execute a go-around unless visual cues are available"}]}, {"id": "total-loss-of-brakes", "name": "Total Loss of Brakes", "ref": "AFM 04-18-70 REV44", "body": [{"k": "step", "n": "1", "i": "Maximum Reverse Thrust", "a": "APPLY"}, {"k": "step", "n": "2", "i": "Brakes", "a": "RELEASE"}, {"k": "step", "n": "3", "i": "Anti-Skid", "a": "OFF"}, {"k": "note", "t": "Applying more than 400 PSI brake pressure could result in blown tires."}, {"k": "step", "n": "4", "i": "Brakes", "a": "APPLY MAXIMUM 400 PSI BRAKE PRESSURE"}, {"k": "note", "t": "If brake pressure is not present after turning off the anti-skid and applying brakes, emergency brakes will have to be used in conjunction with thrust reversers to stop the airplane."}]}, {"id": "ground-spoiler-failure-on-landing", "name": "Ground Spoiler Failure on Landing", "ref": "AFM 04-13-90 REV44", "body": [{"k": "note", "t": "The NO GND SPLRS lights may illuminate after touchdown, then extinguish, in less than one (1) second. This is the normal sequence of events as the ground spoilers go through their automatic deployment process."}, {"k": "step", "n": "1", "i": "SPEED BRAKE", "a": "EXTEND IMMEDIATELY"}]}, {"id": "wow-fault", "name": "WOW Fault", "ref": "AFM 3B-23-70 REV44", "body": [{"k": "info", "t": "EICAS Caution: WOW Fault\nAural Warning: BELL"}, {"k": "info", "t": "Possible Cause (s): Miscomparison between WOW switches and WOW logic status."}, {"k": "info", "t": "Correction Action: DO NOT MOVE THRUST REVERSER LEVERS"}, {"k": "step", "n": "1", "i": "GND SPLR", "a": "OFF"}, {"k": "afm"}]}, {"id": "egpws-alert-terrain", "name": "EGPWS Alert / Terrain", "ref": "AFM REV44", "body": [{"k": "step", "n": "1", "i": "Disconnect Autopilot/Autothrottle and apply power to the mechanical forward limit", "a": ""}, {"k": "step", "n": "2", "i": "Rotate at 3 to 4 degrees per second to increase pitch attitude to the highest possible value while simultaneously retracting speed brakes if deployed.", "a": ""}, {"k": "step", "n": "3", "i": "When the stick shaker is encountered, or as V2/Vref is approached, reduce pitch rate/angle-of-attack to intercept V2/Vref – 20 KCAS.", "a": ""}, {"k": "step", "n": "4", "i": "DO NOT retract flaps or landing gear until safe climb out is assured.", "a": ""}]}, {"id": "egpws-alert-windshear", "name": "EGPWS Alert / Windshear", "ref": "AFM REV44", "body": [{"k": "step", "n": "1", "i": "Disconnect Autopilot/Autothrottle and apply power to the mechanical forward limit", "a": ""}, {"k": "step", "n": "2", "i": "Rotate at 3 to 4 degrees per second to increase pitch attitude to the highest possible value while simultaneously retracting speed brakes if deployed.", "a": ""}, {"k": "step", "n": "3", "i": "When the stick shaker is encountered, or as V2/Vref is approached, reduce pitch rate/angle-of-attack to intercept V2/Vref – 20 KCAS.", "a": ""}, {"k": "step", "n": "4", "i": "DO NOT retract flaps or landing gear until safe climb out is assured.", "a": ""}]}, {"id": "automatic-emergency-descent-mode-edm", "name": "Automatic Emergency Descent Mode (EDM)", "ref": "AFM 04-21-40 REV44", "body": [{"k": "note", "t": "The autopilot has an automatic Emergency Descent Mode (EDM) that is armed anytime airplane altitude is 40,000 feet or above with autopilot selected ON. When the red Cabin Pressure Low (warning) message is displayed on the Crew Alerting System (CAS) with the airplane altitude 40,000 feet or above and autopilot selected ON, the following occurs:"}, {"k": "note", "t": "• The SPEED target on flight guidance panel changes to 340 KCAS in MANUAL mode.\n• The ALTITUDE preselect is set to 15,000 feet.\n• The autopilot commands a left turn with a 90° heading change in the HEADING HOLD mode.\n• The autothrottle (if engaged) retards power levers to idle. If the autothrottle is not engaged, it automatically engages and retards power levers to idle.\n• The airplane descends at MMO / VMO to 15,000 ft.\n• At 15,000 ft, the SPEED target changes to 250 KCAS.\n• The autothrottle sets power to maintain 250 KCAS.\n• The pilot may override EDM by disconnecting the autopilot."}], "info": true}], "intro": ["Land as soon as possible:", "Land without delay where a safe approach and landing is assured.", "Procedures directing the aircraft to land as soon as possible require the aircrew to shift focus from the original mission to a new mission that prioritizes a safe and expeditious landing. To assure a safe approach and landing, the selected landing site should be appropriate for aircraft performance considerations while accommodating any additional restrictions required by the applicable AFM procedure (i.e. crosswind limits, wide runway). The selected landing site should also provide appropriate safety for crew and passengers once on the ground.", "Land at the nearest suitable airport:", "Extended flight beyond the nearest suitable airport is not recommended.", "a. Procedures directing the aircraft to land at the nearest suitable airport offer aircrew additional flexibility in choosing an appropriate landing site. Aircrew may consider airport facilities, maintenance availability, or other factors when selecting an acceptable airport. Landing at the nearest suitable airport avoids unnecessary risk associated with extended flight in a malfunctioning aircraft."], "lims": [{"id": "maximum-occupants", "title": "Maximum Occupants", "g": "General", "rows": [{"k": ["All Airplanes"], "v": "Not exceed 22"}, {"k": ["Number of passengers"], "v": "19"}]}, {"id": "runway-slope-and-wind-conditions", "title": "Runway, Slope and Wind Conditions", "g": "General", "rows": [{"h": "Runway Conditions"}, {"k": ["Wet"], "v": "is wet when more than 25 percent of the runway surface area is covered by any visible dampness or water that is 1/8 inch (3 mm) or less in depth."}, {"k": ["Contaminated"], "v": "is considered contaminated when more than 25 percent of the runway surface area is covered by any frost, ice, snow, slush, or greater than 1/8 inch (3 mm) of standing water."}, {"h": "Slopes"}, {"k": ["Negative"], "v": "-2%"}, {"k": ["Positive"], "v": "2%"}, {"h": "Wind Conditions"}, {"k": ["Maximum Tail wind"], "v": "takeoff and landing is 10 knots"}]}, {"id": "high-elevation-airport-operations", "title": "High Elevation Airport Operations", "g": "General", "rows": [{"k": ["12,000 feet"], "v": "SN 5001 thru 5059 not having ASC 040"}, {"k": ["14,500 feet"], "v": "SN 5060 and subsequent"}, {"k": ["14,500 feet"], "v": "SN 5001 thru 5059 having ASC 040"}, {"k": ["15,000 feet"], "v": "SN 5323 and subsequent having HLFE/Pax O2"}]}, {"id": "altitude-mach-flight-envelope", "title": "Altitude / Mach Flight Envelope", "g": "Speeds & Altitudes", "rows": [], "fig": {"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA3cAAAOXBAMAAAB1WaWnAAABXmlDQ1BJQ0MgUHJvZmlsZQAAeJxtkM1LAmEQxp81y0gLg07RYS8dAisx89BtUzJhD4smfUDQum5r4G5v60Z179wx+gs6dbejt/6AvqBThy5Fh0DwUvI2r1ZqNTA8Px5mhpkBfGGdsbIfgO14bja9KK+tb8iBZwxiACMIIq4bFaZomkol+NbeaNxBEno9LWbdnoRSr8qw9jhaj/KX2cO/9T0xVDQrBukHZcJgrgdIcWLtwGOCj4nHXFqK+Eyw1eYLwYU211 forming the HMG functional test after starting engines is permitted."}]}, {"id": "stall-warning-stall-barrier-system", "title": "Stall Warning / Stall Barrier System", "g": "Systems", "rows": [{"p": "Takeoff Requirements:\nThere are two stall warning / stall barrier systems installed in the airplane. Dispatch with one stall warning / stall barrier system inoperative is allowed with reference to the MMEL\nUse of System:\nOperative stall barrier systems must be ON during all flight operations unless required to be selected OFF for procedural reasons."}]}, {"id": "speed-brakes", "title": "Speed Brakes", "g": "Systems", "rows": [{"p": "Speed brakes not approved for extension in flight when flaps are at 39°, or landing gear extended."}]}, {"id": "automatic-ground-spoilers", "title": "Automatic Ground Spoilers", "g": "Systems", "rows": [{"p": "Takeoff is permitted with automatic ground spoilers inoperative provided:\nAnti-skid is operative,\n20° flaps are used, and the cowl and wing anti-ice systems are not used."}, {"p": "If a touch-and-go landing is to be performed, the GND SPLR switch must be OFF and manual spoiler landing distances must be taken into account."}]}, {"id": "hydraulic-servicing", "title": "Hydraulic Servicing", "g": "Systems", "rows": [{"k": ["Max. Reservoir Qty (Pressurized)", "Left System"], "v": "4.8 gallons"}, {"k": ["Max. Reservoir Qty (Pressurized)", "Right System"], "v": "1.6 gallons"}, {"k": ["Left and Right System Accumulator Pre-charge (min)"], "v": "1200 psi at 70°F / 21°C"}, {"p": "Note: ±25 psi for each 10°F / 5°C difference in temperature from 70°F / 21°C."}]}, {"id": "ice-and-rain-protection", "title": "Ice and Rain Protection", "g": "Systems", "rows": [{"p": "The Wing A/I does not affect the allowable holdover time\nFor prolonged GND ops it is recommended Wing A/I to remain OFF"}, {"p": "A visual and tactile check of the wing leading edge and upper surface must be performed to ensure the wing is free from ice, snow, frost or slush when the outside air temp is < 42°F (6°C), or if it cannot be ascertained that the wing fuel temperature is above 32°F (0°C); and:\nThere is visible moisture present; or\nWater is present on the wing; or\nThe difference between dew point/ outside air temp is 5°F (3°C) or less; or\nThe atmospheric conditions have been conducive to frost formation."}, {"k": ["Use of flaps while holding in icing conditions"], "v": "NOT PERMITTED"}, {"k": ["Holding in Icing"], "v": "160 KCAS Min. Speed"}, {"k": ["Automatic A/I is inhibited"], "v": "Above 35,000 feet"}, {"p": "Wing A/I must be turned on: if icing are imminent, or immediately upon detection of ice formation on wings, winglets or windshield edges."}, {"p": "Cowl A/I is required on the ground, when the SAT is +10 °C or below and visible moisture, precipitation or wet runways are present."}, {"p": "Cowl A/I is required in flight, as indicated in the cowl anti-ice table, when visible moisture or precipitation is present or when signs of icing is observed."}, {"p": "When taxiing or holding on the ground at low power in temperatures less than 1°C (34°F), engine operation at 40% LP for ten (10) seconds is recommended just prior to takeoff and at intervals of not more than sixty (60) minutes under these temperature and moisture conditions."}, {"p": "Procedure to shed engine ice in flight is:\nQuickly retard one engine at a time to idle, hold for 5” and then accelerate engine to 90% LP RPM."}, {"p": "SAT = GND · TAT = Inflight"}], "fig": {"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1QAAAOqBAMAAABp1wkHAAABX2lDQ1BJQ0MgUHJvZmlsZQAAeJxtkL1Lw2AQxp/Ulogf0MFJRLI4CFGkVge3WrEWMoTW4heiaVpTIY2vaUR0dvAvED92cXCvYzcHNxUFZxeHgiBk0RLvTdS26sHx/Hi4O+4OCEU1xswwgLLl2JnUtLS4tCyJL+hEBL0QEdP0CkuoqkIl+Nb2cB8gcL0b4bPq8dszY+Vw0D2tr53s31z8rW+LrkKxopN+UE7qzHYAIU6s7jqM8wFxn01LER9zNgK+5JwPuObXzGeSxPfEUb2kFYifieV8i2+0cNnc0b924Nv3FK1clrSfcgAKUpCQhoos6Sxy5CiYwwz96f++uN+XxBYY9mBjEwZKcKg7QQ6DiaI/0YKOUcjEMYxRTvB///5j09um+6bSQKjc9NZV4OqVn9n0hmRa5RqorTLN1n6+K7jhys ": "The display of any video unrelated to the operation of the airplane is prohibited.\nThis would include any video feed from the cabin entertainment system."}]}, {"id": "anti-skid", "title": "Anti-Skid", "g": "Systems", "rows": [{"p": "Takeoff is permitted with anti-skid inoperative:\nRunway is dry;\nGround Spoilers are operative;\n20° flaps are used; and\nCowl and Wing A/I systems are not used.\nDispatch with reference to MEL."}]}, {"id": "takeoff-anti-skid-inoperative", "title": "Takeoff Anti-Skid Inoperative", "g": "Systems", "rows": [{"p": "Runway is dry\nGround spoilers are operative\n20° flaps are used\nCowl and wing A/I systems are not used"}]}, {"id": "irs-inertial-ref-system", "title": "IRS (Inertial Ref System)", "g": "Avionics & Nav", "rows": [{"k": ["Max Latitude Alignment"], "v": "78° Northern and Southern"}, {"p": "Alignment Time average 15’ between 70° and 78°"}, {"p": "For flights north of latitude 73 degrees N and south of latitude of 60 degrees S, heading information must be switched from magnetic (MAG) to TRUE due to loss of valid MAG heading from the IRS."}, {"p": "There are no restrictions for in air automatic alignment – Align In Motion (AIM). However, the AIM time may be less than ten (10) minutes or more than twenty (20) minutes if any of the following conditions are present either alone or in combination:\n• No change in heading during alignment\n• No changes in acceleration during alignment\n• An east to west flight trajectory such that the IRUs sensed rotational rates in inertial space is nearly equal to zero (0)."}, {"p": "Airplane maneuvers involving changes in heading reduce alignment time. Alignment time increases with latitude – i.e., minimum time is at the equator and maximum time is at the poles."}]}, {"id": "wx-radar", "title": "WX Radar", "g": "Avionics & Nav", "rows": [{"p": "Do not operate weather radar on the ground:\nDuring Refueling or within 300 (92 m) ft of other refueling operations.\nAll other times, within 49 (15 m) ft of ground personnel."}]}, {"id": "fms", "title": "FMS", "g": "Avionics & Nav", "rows": [{"k": ["Current FMS Database"], "v": "Is required in order to fly any APPR using FMS"}, {"k": ["Nav Data Base"], "v": "If NDB is out of date, verify the LAT/LONG of each waypoint prior to every flight."}, {"k": ["LOC based APPR"], "v": "Must be flown in NAV “GREEN” data"}]}, {"id": "polar-operations", "title": "Polar Operations", "g": "Avionics & Nav", "rows": [{"p": "Polar Operations are defined as operating at 89° latitude or above."}]}, {"id": "gps-sbas-tso-c145c-class-3", "title": "GPS/SBAS TSO-C145C Class 3", "g": "Avionics & Nav", "rows": [{"p": "The installed equipment complies with AC 20-138D for navigation using GPS and GPS/SBAS (within the coverage of a satellite-based augmentation system complying with ICAO Annex 10) for enroute, terminal area, non-precision approach, and approach procedures with vertical guidance operations. Non-precision approach operations include those based on conventional navigation aids with “or GPS” in the title, and those with “GPS”, “GNSS”, “RNAV”, or “RNP” in the title to “LNAV” minimums. Approach procedures with vertical guidance includes those with “GPS”, “GNSS”, “RNAV”, or “RNP” in the title to “LNAV/VNAV” and/or “LPV” minimums."}]}, {"id": "non-wgs-84-airspace-countries-partially-compliant-with-wgs-84", "title": "Non-WGS-84 Airspace / Countries Partially Compliant with WGS-84", "g": "Avionics & Nav", "rows": [{"p": "When operating in non-WGS-84 airspace or in countries where the airspace is partially compliant with WGS-84, the FMS with GPS position updating meets the required navigation accuracy and may be used for SIDS, STARS, and en-route navigation.\nWhen flying ILS, VOR or ADF approaches, and missed approach procedures in these two situations, the GPS updating does not need to be inhibited or deselected provided the appropriate raw data is used throughout the approach and missed approach as the primary navigation reference.\nFor countries that are partially WGS-84 compliant, when RNAV (GNSS) approaches are offered, these approaches may be flown using FMS with GPS position updating provided the approach chart is annotated with “PAN OPS”."}]}, {"id": "takeoff-and-landing-data-told", "title": "Takeoff and Landing Data (TOLD)", "g": "Avionics & Nav", "rows": [{"p": "Use of the TOLD Software ID V1.0 and subsequent for takeoff and landing field performance is permitted. TOLD calculations shall be checked for reasonableness.\nThe G550 AFM Section 5 – Performance shall be available for cross reference as necessary."}]}, {"id": "tcas", "title": "TCAS", "g": "Avionics & Nav", "rows": [{"p": "OEI Select “TA ONLY” as the operating mode."}, {"k": ["TCAS II Version 7.1"], "v": "SN 5001 thru 5379 with ASC 103"}, {"h": "Traffic Advisory"}, {"p": "TA information should be used only as an aid to visual acquisition of traffic."}, {"h": "Resolution Advisory"}, {"p": "Compliance with TCAS (RA) is required unless the pilot considers it unsafe to do so."}]}, {"id": "egpws", "title": "EGPWS", "g": "Avionics & Nav", "rows": [{"p": "Pilots are authorized to deviate from their current Air Traffic Control (ATC) clearance to the extent necessary to comply with an EGPWS warning."}, {"h": "Terrain Display"}, {"p": "The terrain awareness display feature shall be selected OFF (TERRAIN INHIBIT switch selected ON) when within 15 NM of the departure or destination airport when the airport is not contained in the EGPWS terrain database."}]}, {"id": "efvs", "title": "EFVS", "g": "Avionics & Nav", "rows": [{"p": "Using the EFVS requires the Head Up Display (HUD I or HUD II) System\nDescriptions and Enhanced Vision System."}, {"h": "Presence of Visual Cues"}, {"p": "For EFVS operations to 100 feet above the TDZE, at 100 feet HAT, visual cues must be seen without the aid of EVS to continue descent to landing.\nFor EFVS operations to touchdown and rollout, descending below DA/DH requires that visual references be distinctly visible and identifiable to the pilot using an EFVS."}, {"h": "Vertical Guidance Requirements for IMC EFVS"}, {"p": "Approaches to 100 Feet Above The Touchdown Zone Elevation:\nFlight Director or autopilot with vertical guidance, either ILS or FMS vertical path, is required for all IMC EFVS approaches."}, {"h": "EFVS Performance Capability for IMC EFVS to Touchdown and Rollout"}, {"p": "The demonstrated performance of the installed HUD II and EVS II camera on G550 aircraft serial numbers 5276 and subsequent meets the criteria of AC 20-167A."}]}, {"id": "heads-up-display", "title": "Heads-up Display", "g": "Avionics & Nav", "rows": [{"p": "Category I HUD operations are approved."}, {"h": "Non-Directional Beacon Approaches"}, {"p": "The HUD does not provide a Non-Directional Beacon (NDB) approach capability. NDB approaches may be set up and flown through the FMS, using the HUD for guidance."}]}, {"id": "taws", "title": "TAWS", "g": "Avionics & Nav", "rows": [{"p": "The production EGPWS installation meets the requirements for Class A TAWS as defined in Advisory Circular AC 25-23."}]}, {"id": "fm-immunity", "title": "FM Immunity", "g": "Avionics & Nav", "rows": [{"p": "All Honeywell navigation receiver installations comply with all applicable standards of relevant FAA TSOs, Radio Technical Commission for Aeronautics (RTCA), and ICAO Annex 10 specifications for FM immunity."}]}, {"id": "rvsm-dispatch-capability", "title": "RVSM Dispatch Capability", "g": "Avionics & Nav", "rows": [{"p": "Prior to takeoff the aircraft altimeters shall be set to the local altimeter atmospheric pressure at nautical height (QNH) setting and the displayed altitude must be within ±75 feet of a known elevation (e.g., field elevation). Additionally, the two primary altimeters must display an altitude within ±75 feet of each other."}, {"h": "Minimum equipment for RVSM (installed / required)"}, {"k": ["22-7 Flight Guidance Computers"], "v": "2 / 1"}, {"k": ["34-8 ATC Transponder & Automatic Altitude Reporti  feature when being vectored by ATC, or initiate the approach via a published IAF (Initial Approach Fix)."}, {"p": "For airplanes having ASC 084 (or later approved revisions), VGP mode cannot be used during circling approaches."}, {"p": "VGP Mode cannot be armed if the Preview mode is active."}]}, {"id": "sv-pfd", "title": "SV-PFD", "g": "Avionics & Nav", "rows": [{"p": "SV-PFD synthetic terrain must be deselected when in non-WGS 84 areas."}, {"p": "For airplanes having ASC 061, one pilot must have a 2/3 PFD displayed when\nSV-PFD is being displayed."}, {"p": "For airplanes having ASC 061A (or later approved revisions), both pilots may have SV-PFD displayed."}, {"p": "The SV-PFD synthetic terrain display may not be used for navigation."}]}, {"id": "oxygen-departure-pressures", "title": "Oxygen Departure Pressures", "g": "Systems", "rows": [{"p": "The quantity of oxygen required varies with the flight profile."}], "fig": {"src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABEwAAAL7BAMAAAAVMA1+AAAKumlDQ1BJQ0MgUHJvZmlsZQAAeJyVlwdUU0kXx+e99EZLQDqhhiJIJ4CU0AMovYpKSAIEQgwJAcSOLCq4FlREsKzIooiClWbHgoVFsYB9QRYVZV0siIrKPuAQdvdr57vnzJnfu7nzn3vnzJxzAwDFlCMWC2ElADJEWZJwfy96bFw8HTcA8AAHqIAB6ByuVMwKDQ0GiE3Nf7ePXQAan+9Yjmv96+//1ZR5fCkXACgU4SSelJuB8AkAYJgrlmQBgGpC/IY5WeJxfowwTYIkiPDQOKdMMBo9zkmTrD4RExnujfBMAPBkDkeSAgCZifjp2dwURIcci7C1iCcQIbwWYfeMjEU8hK8ibIrEiBEe12cm/UUn5W+aSXJNDidFzpO1TBjeRyAVCzmL/8/j+N+WIZRN7cFABjlVEhCOzLrIuf2WvihIzqKkuSFTLOBNxE9wqiwgaoq5Uu/4KZYKI9hTzOP4BMl1hHODpzhZ4CePEWSxI6eYL/WNmGLJonD5vskSb9YUcyTTOcjSo+T+VD5brp+XGhkzxdmC6Lny3NIjgqZjvOV+iSxcXgtf5O81va+f/BwypH+pXcCWr81KjQyQnwNnOn++iDWtKY2V58bj+/hOx0TJ48VZXvK9xMJQeTxf6C/3S7Mj5GuzkMs5vTZUfoZpnMDQKQYRQAB4gA+4gAMkgA58kG8pEAMh8o1cqSx+btZ4Ud6LxIslgpTULDoLeXl8OlvEtZpJt7W2dQBg/B1PXpP3YRPvE1Jrn/at/hUAt3NjY2Onpn2B5wA46gQAsXnaZ4rca2USAFebuTJJ9qRv/LkBDCACRUADGkjGhsAUWAJb4AhcgSfwBYEgBESCOLAAyT8VZCAV5IClYBUoBMVgE9gGysEesA8cAIfBMdAIToML4Aq4AW6Be+AR6AH94DUYAh/BKARBOIgCUSENSA8yhiwgW4gJuUO+UDAUDsVBiVAKJIJk0FJoNVQMlUDl0F6oBjoKNUM
