<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const R=DATA.recall, L=DATA.lims;

/* ---------- storage ---------- */
const KEY='g550lr.v1';
let S={proc:{},quiz:[],missed:{}};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null'); if(x) S=Object.assign(S,x);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- tabs ---------- */
$$('#tabs button').forEach(b=>b.onclick=()=>{
  $$('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.v));
  if(b.dataset.v==='prog') renderProg();
  window.scrollTo(0,0);
});

/* ================= RECALL ================= */
const steps=p=>p.body.filter(b=>b.k==='step');
const drillable=p=>steps(p).length>0;
let cur=R.findIndex(drillable), mode='study';
function badge(p){
  const s=S.proc[p.id];
  if(!drillable(p)) return '<span class="badge b-none">info</span>';
  if(!s) return '<span class="badge b-none">–</span>';
  const v=s.best, c=v>=100?'b-ok':v>=70?'b-mid':'b-bad';
  return `<span class="badge ${c}">${v}%</span>`;
}
function renderList(){
  const q=$('#pSearch').value.trim().toLowerCase();
  $('#plist').innerHTML=R.map((p,i)=>{
    if(q && !(p.name+' '+p.ref+' '+JSON.stringify(p.body)).toLowerCase().includes(q)) return '';
    return `<li data-i="${i}" class="${i===cur?'on':''}"><span>${esc(p.name)}</span><span class="sc">${badge(p)}</span></li>`;
  }).join('');
  $$('#plist li').forEach(li=>li.onclick=()=>{cur=+li.dataset.i; renderList(); renderPane(); if(innerWidth<=760) $('#rPane').scrollIntoView({behavior:'smooth'});});
}
$('#pSearch').oninput=renderList;
$('#pRandom').onclick=()=>{const c=R.map((p,i)=>i).filter(i=>drillable(R[i])&&i!==cur); cur=c[Math.floor(Math.random()*c.length)]; renderList(); renderPane();};
$('#pWeak').onclick=()=>{
  const c=R.map((p,i)=>i).filter(i=>drillable(R[i])).sort((a,b)=>{
    const sa=S.proc[R[a].id], sb=S.proc[R[b].id];
    const va=sa?sa.best:-1, vb=sb?sb.best:-1; if(va!==vb) return va-vb;
    return (sa?sa.t:0)-(sb?sb.t:0);});
  cur=c[0]; renderList(); renderPane();
};
$$('#rMode button').forEach(b=>b.onclick=()=>{mode=b.dataset.m; $$('#rMode button').forEach(x=>x.classList.toggle('on',x===b)); renderPane();});
$('#hideItem').onchange=renderPane; $('#showNotes').onchange=renderPane;

function blockHTML(b){
  const notes=$('#showNotes').checked;
  switch(b.k){
    case 'info': return `<div class="blk b-info">${esc(b.t)}</div>`;
    case 'cond': return `<div class="blk b-cond">${esc(b.t)}</div>`;
    case 'warn': return `<div class="blk b-warn">${esc(b.t)}</div>`;
    case 'caut': return `<div class="blk b-caut">${esc(b.t)}</div>`;
    case 'note': return notes?`<div class="blk b-note">${esc(b.t)}</div>`:'';
    case 'afm':  return `<div><span class="blk b-afm">→ Continue with AFM procedure</span></div>`;
  }
  return '';
}
function stepHTML(b,cls,hideItem,mk){
  const full=!b.a, act=b.a||b.i;
  const m=mk?`<span class="mk">${mk}</span>`:'';
  return `<div class="step ${cls}"><div class="n">${esc(b.n||'•')}</div><div class="i ${hideItem?'h':''}">${full?'':esc(b.i)}</div><div class="a" style="${full?'grid-column:2/4;text-align:left;max-width:none':''}">${esc(act)}${m}</div></div>`;
}
function head(p){return `<p class="qrh-title">${esc(p.name)}</p><div class="ref">${esc(p.ref||'Recall item')}</div>`;}

let D=null; // drill state
function renderPane(){
  const p=R[cur]; if(!p) return;
  $('#hideItemWrap').style.display=mode==='drill'?'':'none';
  $('#notesWrap').style.display=mode==='seq'?'none':'';
  if(mode==='study' || !drillable(p)){
    D=null;
    $('#rPane').innerHTML=head(p)+(mode!=='study'&&!drillable(p)?'<div class="blk b-info">No recall steps in this item — read it in Study mode.</div>':'')+
      p.body.map(b=>b.k==='step'?stepHTML(b,'',false):blockHTML(b)).join('');
    return;
  }
  if(mode==='drill'){ D={p,pos:0,revealed:false,res:[]}; drawDrill(); }
  if(mode==='seq'){ startSeq(p); }
}
function drawDrill(){
  const p=D.p, hideItem=$('#hideItem').checked;
  const st=steps(p);
  let html=head(p), si=0, done=D.pos>=st.length;
  for(const b of p.body){
    if(b.k!=='step'){
      // show non-step blocks only once reached (blocks before the current step)
      if(si<=D.pos) html+=blockHTML(b);
      continue;
    }
    if(si<D.pos){ const ok=D.res[si]; html+=stepHTML(b,ok?'good':'miss',false,ok?'✓':'✗'); }
    else if(si===D.pos){ html+=stepHTML(b,'cur'+(D.revealed?'':' hide'),hideItem&&!D.revealed); }
    si++;
    if(si>D.pos) { if(si-1===D.pos) break; }
  }
  if(done){
    const n=D.res.filter(Boolean).length, pct=Math.round(100*n/st.length);
    html+=`<div style="margin-top:16px" class="result">${n} / ${st.length} · ${pct}%</div>`+
      `<div class="row" style="margin-top:10px"><button class="btn" id="dAgain">Again</button><button class="btn sec" id="dNext">Next weakest</button><button class="btn sec" id="dStudy">Study card</button></div>`;
    $('#rPane').innerHTML=html;
    $('#dAgain').onclick=renderPane; $('#dNext').onclick=()=>$('#pWeak').click();
    $('#dStudy').onclick=()=>$$('#rMode button')[0].click();
    return;
  }
  html+=`<div class="drillbar">`+(D.revealed?
    `<button class="btn bad" id="dMiss">✗ Missed</button><button class="btn ok" id="dGot">✓ Got it</button>`:
    `<button class="btn" id="dRev">Reveal step ${D.pos+1} of ${st.length}</button>`)+`</div>`;
  $('#rPane').innerHTML=html;
  if(D.revealed){ $('#dGot').onclick=()=>grade(true); $('#dMiss').onclick=()=>grade(false); }
  else $('#dRev').onclick=()=>{D.revealed=true; drawDrill();};
  const c=$('#rPane .step.cur'); if(c && c.getBoundingClientRect().bottom>innerHeight-90) c.scrollIntoView({block:'center',behavior:'smooth'});
}
function grade(ok){
  D.res[D.pos]=ok; D.pos++; D.revealed=false;
  const st=steps(D.p);
  if(D.pos>=st.length) record(D.p, Math.round(100*D.res.filter(Boolean).length/st.length));
  drawDrill();
}
function record(p,pct){
  const s=S.proc[p.id]||{best:0,last:0,n:0,t:0};
  s.best=Math.max(s.best,pct); s.last=pct; s.n++; s.t=Date.now(); S.proc[p.id]=s; save(); renderList();
}
/* sequence */
let Q=null;
function startSeq(p){
  const st=steps(p);
  if(st.length<3){ $('#rPane').innerHTML=head(p)+'<div class="blk b-info">Sequence needs 3+ steps — try Drill.</div>'; return; }
  Q={p,st,next:0,err:0,order:shuffle(st.map((s,i)=>i))};
  drawSeq();
}
function drawSeq(){
  const {p,st}=Q; const lbl=b=>b.a?`${b.i} — ${b.a}`:b.i;
  let html=head(p)+'<div class="muted">Tap the steps in the correct order.</div>';
  html+=st.slice(0,Q.next).map(b=>stepHTML(b,'good',false)).join('');
  if(Q.next>=st.length){
    const pct=Math.max(0,Math.round(100*(st.length-Q.err)/st.length));
    html+=`<div class="result" style="margin-top:14px">Done · ${Q.err} error${Q.err===1?'':'s'}</div><div class="row" style="margin-top:10px"><button class="btn" id="sAgain">Again</button><button class="btn sec" id="sNext">Random</button></div>`;
    $('#rPane').innerHTML=html; $('#sAgain').onclick=()=>startSeq(p); $('#sNext').onclick=()=>$('#pRandom').click();
    return;
  }
  html+='<div class="seqopts">'+Q.order.filter(i=>i>=Q.next).map(i=>`<button class="seqopt" data-i="${i}">${esc(lbl(st[i]))}</button>`).join('')+'</div>';
  $('#rPane').innerHTML=html;
  $$('.seqopt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    // accept any step with identical label (duplicates like Autopilot DISCONNECT)
    if(lbl(st[i])===lbl(st[Q.next])){ Q.next++; drawSeq(); }
    else { Q.err++; b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); }
  });
}
$('#defsBody').innerHTML=DATA.intro.map(t=>/:$/.test(t)?`<h3>${esc(t.replace(/:$/,''))}</h3>`:`<p>${esc(t)}</p>`).join('');

/* ================= LIMITATIONS ================= */
const GROUPS=['All',...[...new Set(L.map(s=>s.g))]];
let lg='All';
$('#lGroups').innerHTML=GROUPS.map(g=>`<button class="chip ${g===lg?'on':''}" data-g="${g}">${g}</button>`).join('');
$$('#lGroups .chip').forEach(c=>c.onclick=()=>{lg=c.dataset.g; $$('#lGroups .chip').forEach(x=>x.classList.toggle('on',x===c)); renderLims();});
$('#lSearch').oninput=renderLims; $('#flash').onchange=renderLims;
$('#lJump').onchange=e=>{const el=document.getElementById('s-'+e.target.value); if(el){ const y=el.getBoundingClientRect().top+scrollY-140; scrollTo({top:y,behavior:'smooth'});} e.target.value='';};
function hl(txt,q){
  const e=esc(txt); if(!q) return e;
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return e.replace(re,'<mark>$1</mark>');
}
function renderLims(){
  const q=$('#lSearch').value.trim(), ql=q.toLowerCase(), flash=$('#flash').checked;
  const secs=L.filter(s=>(lg==='All'||s.g===lg)&&(!ql||(s.title+' '+JSON.stringify(s.rows)).toLowerCase().includes(ql)));
  $('#lJump').innerHTML='<option value="">Jump to section…</option>'+secs.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('');
  $('#lBody').innerHTML=secs.length?secs.map(s=>{
    let h=`<div class="card sec" id="s-${s.id}"><h2>${hl(s.title,q)} <span class="g">${esc(s.g)}</span></h2>`;
    let tb=[];
    const flush=()=>{ if(tb.length){ h+=`<table class="kv ${flash?'flash':''}">${tb.join('')}</table>`; tb=[]; } };
    for(const r of s.rows){
      if(r.k){
        const k=r.k.length>1?`${hl(r.k[0],q)} <small>· ${r.k.slice(1).map(x=>hl(x,q)).join(' · ')}</small>`:hl(r.k[0],q);
        tb.push(`<tr><td class="k">${k}</td><td class="v">${hl(r.v,q)}</td></tr>`);
      } else { flush(); if(r.h) h+=`<h3>${hl(r.h,q)}</h3>`; if(r.p) h+=`<p class="lp">${hl(r.p,q)}</p>`; }
    }
    flush();
    if(s.fig) h+=`<div class="fig"><img src="${s.fig.src}" alt="${esc(s.fig.cap)}" data-fig="1"><span class="muted">${esc(s.fig.cap)} · tap to enlarge</span></div>`;
    return h+'</div>';
  }).join(''):'<div class="card muted">No match.</div>';
  $$('#lBody td.v').forEach(td=>td.onclick=()=>td.classList.toggle('rev'));
  $$('#lBody img[data-fig]').forEach(im=>im.onclick=()=>{$('#vImg').src=im.src; $('#viewer').classList.add('on'); $('#viewer').classList.remove('z2');});
}
$('#vClose').onclick=()=>$('#viewer').classList.remove('on');
$('#vZoom').onclick=()=>$('#viewer').classList.toggle('z2');

/* ================= QUIZ ================= */
const unitOf=a=>{const m=a.match(/KCAS|KTS|kt|knots|ft|feet|’|°C|°F|psi|PSI|%|lb|kVA|IPS|Mt|\bM\b|min|sec|gallons|volts|V\b|g\b/i);return m?m[0].toLowerCase():'';};
const hasNum=s=>/\d/.test(s);
const numKey=k=>/^[<>≥≤\-+]?\s?(FL)?\d/.test(k)||/^[<>]\s?FL/.test(k);
function buildLimFacts(){
  const out=[];
  for(const s of L){
    let hd='', local=[];
    for(const r of s.rows){
      if(r.h){hd=r.h; continue;}
      if(!r.k) continue;
      const key=r.k.join(' · ');
      if(numKey(r.k[0])){
        for(const line of r.v.split('\n')) local.push({ctx:s.title+(hd?' · '+hd:''),q:line.replace(/^\s*[–-]\s*/,''),a:key,src:s.title,g:s.g,ask:'Which value?'});
      } else if(hasNum(r.v) && r.v.length<=70){
        local.push({ctx:s.title+(hd?' · '+hd:''),q:key,a:r.v.replace(/\n/g,' / '),src:s.title,g:s.g,ask:''});
      }
    }
    // drop ambiguous prompts
    const cnt={}; local.forEach(f=>{const k=f.q+'|'+f.ctx; cnt[k]=cnt[k]||new Set(); cnt[k].add(f.a);});
    local.filter(f=>cnt[f.q+'|'+f.ctx].size===1).forEach(f=>{ if(!out.some(o=>o.q===f.q&&o.ctx===f.ctx)) out.push(f); });
  }
  out.forEach(f=>{f.id='L|'+f.ctx+'|'+f.q; f.kind='lim';});
  return out;
}
function buildRecallFacts(){
  const resp=[], next=[];
  for(const p of R){
    const st=steps(p);
    st.forEach((b,i)=>{
      if(b.a) resp.push({kind:'resp',ctx:p.name,q:`${b.n?'Step '+b.n+': ':''}${b.i}`,a:b.a,src:p.name,pid:p.id});
      if(i<st.length-1){ const n=st[i+1]; next.push({kind:'next',ctx:p.name,q:`After “${b.a?b.i+' — '+b.a:b.i}”, the next step is:`,a:n.a?`${n.i} — ${n.a}`:n.i,src:p.name,pid:p.id}); }
    });
  }
  resp.forEach(f=>f.id='R|'+f.ctx+'|'+f.q); next.forEach(f=>f.id='N|'+f.ctx+'|'+f.q);
  return {resp,next};
}
const LF=buildLimFacts(), RF=buildRecallFacts();
const ALL=[...LF,...RF.resp,...RF.next];
function perturb(a){
  const m=a.match(/-?\d[\d,]*\.?\d*/); if(!m) return [];
  const raw=m[0], dec=(raw.split('.')[1]||'').length, n=parseFloat(raw.replace(/,/g,''));
  if(!isFinite(n)||n===0) return [];
  const fmt=v=>{let t=v.toFixed(dec); if(raw.includes(',')) t=Number(t).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec}); return t;};
  const f=[0.8,0.9,1.1,1.2,0.75,1.25].map(k=>n*k);
  return [...new Set(f.map(fmt))].filter(t=>t!==raw).map(t=>a.replace(raw,t));
}
function distractors(f,pool){
  const out=new Set(), norm=x=>x.trim().toUpperCase();
  const add=arr=>{for(const x of shuffle(arr)){ if(out.size>=3) break; if(norm(x)!==norm(f.a) && ![...out].some(o=>norm(o)===norm(x))) out.add(x);} };
  if(f.kind==='lim'){
    const u=unitOf(f.a);
    add(pool.filter(o=>o.kind==='lim'&&o.src===f.src&&o.ask===f.ask&&unitOf(o.a)===u).map(o=>o.a));
    add(pool.filter(o=>o.kind==='lim'&&o.g===f.g&&o.ask===f.ask&&unitOf(o.a)===u).map(o=>o.a));
    add(pool.filter(o=>o.kind==='lim'&&o.ask===f.ask&&unitOf(o.a)===u).map(o=>o.a));
    if(out.size<3) add(perturb(f.a));
    add(pool.filter(o=>o.kind==='lim'&&o.ask===f.ask).map(o=>o.a));
  } else {
    add(pool.filter(o=>o.kind===f.kind&&o.src===f.src).map(o=>o.a));
    add(pool.filter(o=>o.kind===f.kind).map(o=>o.a));
  }
  return [...out];
}
const SRC=[['lim','Limitations numbers'],['resp','Recall responses'],['next','Recall next step'],['mix','Mixed'],['missed','Review missed']];
let qs='lim', qg='All', qn=20;
function chipRow(el,items,val,set){
  $(el).innerHTML=items.map(([v,l])=>`<button class="chip ${v==val?'on':''}" data-v="${v}">${l}</button>`).join('');
  $$(el+' .chip').forEach(c=>c.onclick=()=>{set(c.dataset.v); $$(el+' .chip').forEach(x=>x.classList.toggle('on',x===c)); updAvail();});
}
function pool(){
  let p;
  if(qs==='lim') p=LF.filter(f=>qg==='All'||f.g===qg);
  else if(qs==='resp') p=RF.resp; else if(qs==='next') p=RF.next;
  else if(qs==='missed') p=ALL.filter(f=>S.missed[f.id]);
  else p=[...LF,...RF.resp,...RF.next];
  return p;
}
function updAvail(){ $('#qGroupWrap').style.display=qs==='lim'?'':'none'; $('#qAvail').textContent=pool().length+' questions available'; }
chipRow('#qSrc',SRC,qs,v=>qs=v);
chipRow('#qGroup',GROUPS.filter(g=>g!=='Temperatures'||LF.some(f=>f.g===g)).map(g=>[g,g]),qg,v=>qg=v);
chipRow('#qN',[[10,'10'],[20,'20'],[40,'40'],[9999,'All']],qn,v=>qn=+v);
updAvail();
let QZ=null;
$('#qStart').onclick=()=>{
  const p=pool(); if(!p.length){ $('#qAvail').textContent='Nothing to review yet.'; return; }
  QZ={items:shuffle(p).slice(0,qn),i:0,ok:0,miss:[],ans:false};
  $('#qSetup').style.display='none'; $('#qRun').style.display=''; drawQ();
};
function drawQ(){
  const z=QZ;
  if(z.i>=z.items.length){
    const pct=Math.round(100*z.ok/z.items.length);
    S.quiz.push({t:Date.now(),src:qs,n:z.items.length,ok:z.ok}); if(S.quiz.length>200) S.quiz.shift(); save();
    $('#qRun').innerHTML=`<h2>Result</h2><div class="result">${z.ok} / ${z.items.length} · ${pct}%</div>`+
      (z.miss.length?`<h3>Review</h3><ul class="miss">${z.miss.map(f=>`<li><b>${esc(f.ctx)}</b> — ${esc(f.ask?f.q:f.q)} → <b>${esc(f.a)}</b></li>`).join('')}</ul>`:'<p>Clean sheet.</p>')+
      `<div class="row" style="margin-top:12px"><button class="btn" id="qAgain">New quiz</button></div>`;
    $('#qAgain').onclick=()=>{$('#qRun').style.display='none'; $('#qSetup').style.display=''; updAvail();};
    return;
  }
  const f=z.items[z.i];
  const opts=shuffle([f.a,...distractors(f,ALL)]);
  const prompt=f.kind==='lim'?(f.ask?`${f.ask}\n${f.q}`:f.q):f.q;
  $('#qRun').innerHTML=`<div class="row"><span class="muted">Question ${z.i+1} / ${z.items.length}</span><span class="muted" style="margin-left:auto">✓ ${z.ok}</span></div>
   <div class="pbar"><div style="width:${100*z.i/z.items.length}%"></div></div>
   <div class="qctx">${esc(f.ctx)}</div><div class="q">${esc(prompt)}</div>
   <div class="opts">${opts.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}</div>
   <div class="row" style="margin-top:12px"><button class="btn" id="qNext" style="display:none">Next</button><button class="btn sec" id="qQuit">End</button></div>`;
  $$('.opt').forEach(b=>b.onclick=()=>{
    if(z.ans) return; z.ans=true;
    const good=b.textContent===f.a;
    $$('.opt').forEach(x=>{ if(x.textContent===f.a) x.classList.add('ok'); });
    if(good){ z.ok++; if(S.missed[f.id]){ S.missed[f.id]--; if(S.missed[f.id]<=0) delete S.missed[f.id]; } }
    else { b.classList.add('bad'); z.miss.push(f); S.missed[f.id]=2; }
    save(); $('#qNext').style.display='';
  });
  $('#qNext').onclick=()=>{z.i++; z.ans=false; drawQ();};
  $('#qQuit').onclick=()=>{z.items=z.items.slice(0,z.i+(z.ans?1:0)); z.i=z.items.length; drawQ();};
}

/* ================= PROGRESS ================= */
function renderProg(){
  const dr=R.filter(drillable), done=dr.filter(p=>S.proc[p.id]), perfect=dr.filter(p=>S.proc[p.id]&&S.proc[p.id].best>=100);
  const qt=S.quiz.reduce((a,q)=>a+q.n,0), qo=S.quiz.reduce((a,q)=>a+q.ok,0);
  const fmt=t=>t?new Date(t).toLocaleDateString():'–';
  $('#progBody').innerHTML=`<div class="card"><h2>Overview</h2>
    <div class="stat"><b>${done.length}/${dr.length}</b><span>recall items drilled</span></div>
    <div class="stat"><b>${perfect.length}</b><span>at 100%</span></div>
    <div class="stat"><b>${qt?Math.round(100*qo/qt)+'%':'–'}</b><span>quiz accuracy (${qt} answered)</span></div>
    <div class="stat"><b>${Object.keys(S.missed).length}</b><span>questions to review</span></div></div>
    <div class="card"><h2>Recall items</h2><table class="prog"><tr><th>Procedure</th><th>Best</th><th>Last</th><th>Runs</th><th>Date</th></tr>
    ${dr.slice().sort((a,b)=>((S.proc[a.id]||{best:-1}).best)-((S.proc[b.id]||{best:-1}).best)).map(p=>{const s=S.proc[p.id];
      return `<tr><td>${esc(p.name)}</td><td>${badge(p)}</td><td>${s?s.last+'%':'–'}</td><td>${s?s.n:0}</td><td class="muted">${fmt(s&&s.t)}</td></tr>`;}).join('')}
    </table></div>
    <div class="card"><h2>Reset</h2><p class="muted">Progress is stored on this device only.</p><button class="btn sec" id="reset">Reset all progress</button></div>`;
  $('#reset').onclick=()=>{ if(confirm('Reset all progress?')){ S={proc:{},quiz:[],missed:{}}; save(); renderProg(); renderList(); } };
}

renderList(); renderPane(); renderLims();
})();

</script>
